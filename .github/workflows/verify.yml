name: verify

# Pull requests are validated by the pull_request trigger alone. Restricting
# push to main avoids running the whole pipeline twice for every PR branch.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads repo contents unless stated otherwise.
permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks (full history, redacted)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces)
        run: npm ci

      - name: Install (services/api lockfile)
        run: npm ci --no-workspaces
        working-directory: services/api

      - name: Install (services/collab-relay lockfile)
        run: npm ci --no-workspaces
        working-directory: services/collab-relay

      - name: Audit root (prod deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit services/api (prod deps)
        run: npm audit --omit=dev --audit-level=high --no-workspaces
        working-directory: services/api

      - name: Audit services/collab-relay (prod deps)
        run: npm audit --omit=dev --audit-level=high --no-workspaces
        working-directory: services/collab-relay

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Setup Java 21 (firebase emulators require JDK >= 21)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI (lock-flow E2E emulator stack, step 11/11)
        run: npm install -g firebase-tools@15.24.0

      - name: Verify
        run: ./ops/verify_local.sh
